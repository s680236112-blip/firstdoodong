<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ดูดวงพรหมชาติ 2569</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Sarabun', sans-serif;
        background: linear-gradient(135deg, #f5ecd5, #e6cfa1);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        color: #4a3311;
    }

    .card-container {
        background-color: #fffdf8;
        border: 2px solid #d4af37;
        border-radius: 15px;
        padding: 30px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        max-width: 550px;
        width: 90%;
        position: relative;
        background-image: radial-gradient(#fbf5e6 10%, transparent 10%), radial-gradient(#fbf5e6 10%, transparent 10%);
        background-size: 20px 20px;
        background-position: 0 0, 10px 10px;
    }

    /* ปรับขนาดรูปภาพตรงนี้ครับ (width และ height) */
    .spin-image {
        width: 240px; 
        height: 240px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #d4af37;
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.8);
        margin-bottom: 20px;
        transition: transform 0.3s ease-out; 
    }

    .spinning {
        animation: spin 0.8s linear infinite; 
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    h2 {
        color: #8b0000;
        margin-top: 0;
        font-weight: 600;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        border-bottom: 2px solid #d4af37;
        padding-bottom: 10px;
        display: inline-block;
    }

    .form-group {
        margin: 15px 0;
        font-size: 18px;
    }

    input[type="number"], select {
        font-family: 'Sarabun', sans-serif;
        padding: 8px 15px;
        border: 1px solid #d4af37;
        border-radius: 20px;
        font-size: 16px;
        outline: none;
        background-color: #fefcf5;
        color: #4a3311;
    }

    input[type="number"]:focus, select:focus {
        box-shadow: 0 0 5px rgba(212, 175, 55, 0.5);
    }

    .btn {
        font-family: 'Sarabun', sans-serif;
        border: none;
        padding: 10px 25px;
        border-radius: 25px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        transition: transform 0.2s, box-shadow 0.2s;
        margin: 10px 5px;
    }

    .btn:active {
        transform: scale(0.95);
    }

    .btn-predict {
        background: linear-gradient(to bottom, #b31217, #7a0000);
        color: white;
    }

    .btn-predict:disabled {
        background: #ccc;
        cursor: not-allowed;
        box-shadow: none;
    }

    .btn-reset {
        background: linear-gradient(to bottom, #e3c05c, #b89225);
        color: white;
    }

    .result-label {
        font-weight: 600;
        color: #8b0000;
        margin-top: 15px;
        display: block;
    }

    .result-box {
        width: 100%;
        box-sizing: border-box;
        height: 130px;
        margin-top: 10px;
        padding: 15px;
        font-size: 16px;
        line-height: 1.6;
        border: 2px dashed #d4af37;
        border-radius: 10px;
        background-color: #fffdf5;
        color: #4a3311;
        resize: none;
        font-family: 'Sarabun', sans-serif;
        text-align: center;
    }
</style>
<script type="text/javascript">
function predictFortune() {
    var age = parseInt(document.getElementById("age").value);
    var gender = document.getElementById("gender").value;
    var resultText = document.getElementById("result");
    var wheelImg = document.getElementById("wheel-img");
    var predictBtn = document.getElementById("predict-btn");

    if (isNaN(age) || age <= 0) {
        alert("กรุณากรอกอายุให้ถูกต้อง");
        return;
    }

    wheelImg.classList.add("spinning");
    predictBtn.disabled = true;
    resultText.value = "กำลังทำนายดวงชะตา...";

    setTimeout(function() {
        wheelImg.classList.remove("spinning");
        predictBtn.disabled = false;

        var fortunes = {
            "เจดีย์": "ตำราพรหมชาติ 2569 ตกเจดีย์\nทำนายว่า: ดวงชะตาในปีนี้จะร่มเย็นเป็นสุข คิดหวังสิ่งใดจะสมปรารถนาทุกประการ สุขกาย สบายใจตลอดปี ศัตรูที่ปองร้ายจะแพ้ภัยตนเอง",
            "นาคราช": "ตำราพรหมชาติ 2569 ตกนาคราช\nทำนายว่า: ปีนี้ดวงชะตากำลังจะดีขึ้น แต่มีเกณฑ์จะได้รับความทุกข์ร้อน เจ็บไข้ได้ป่วย ถึงขั้นอาจมีเลือดตกยางออก อีกทั้งยังมีเกณฑ์ถูกปองร้ายจากศัตรู ควรละเว้นจากการฆ่าสัตว์ และทำบุญเสริมชะตา",
            "แม่มด": "ตำราพรหมชาติ 2569 ตกแม่มด\nทำนายว่า: ดวงชะตาปีนี้จะมีแต่คนเมตตา และมีคนคอยอุปถัมภ์ค้ำจุน อุ้มชูให้ประสบความสำเร็จ พบเจอแต่ความสุข จะได้รับความเชื่อใจจากคนรอบตัว แม้จะได้รับโชคเล็กๆ น้อยๆ แต่ก็อาจจะต้องเหนื่อยกาย เหนื่อยใจอยู่บ้าง",
            "พ่อหมอ": "ตำราพรหมชาติ 2569 ตกพ่อหมอ\nทำนายว่า: ดวงชะตาจะได้รับการอุปถัมภ์จากผู้ใหญ่ จะนำพามาซึ่งยศและตำแหน่ง ความก้าว และโชคลาภต่อเนื่อง ปราศจากภยันตรายต่างๆ หากคนโสดจะได้รับการแนะนำคู่จากผู้ใหญ่",
            "คนต้องขื่อคา": "ตำราพรหมชาติ 2569 ตกคนต้องขื่อคา\nทำนายว่า: ดวงชะตาจะไม่สู้ดีนัก อาจมีเรื่องวุ่นวายเกิดขึ้น ญาติพี่น้องจะนำความเดือดเนื้อร้อนใจมาให้ ส่วนคนรักจะห่างเหิน ควรทำบุญ หลีกเลี่ยงการลงทุนและการเดินทางไกล",
            "เทวดาขี่เต่า": "ตำราพรหมชาติ 2569 ตกเทวดาขี่เต่า\nทำนายว่า: ดวงชะตาจะมีความสุข การเงินมีกิน มีใช้ตลอดปี และการงานอยู่ในเกณฑ์ที่ดี อย่างไรก็ดี ในปีนี้จะเริ่มทำสิ่งใดจะต้องคิดให้รอบคอบก่อนเสมอ เพื่อป้องกันความผิดพลาด",
            "ฉัตรทอง": "ตำราพรหมชาติ 2569 ตกฉัตรทอง\nทำนายว่า: ในปีนี้มีเกณฑ์จะได้รับความสุข ความสบายใจ มีผู้ใหญ่คอยอุปถัมภ์เป็นอย่างดี ได้รับโชคลาภ ทั้งมีด้วยทรัพย์สินเงินทอง ลาภยศ ตำแหน่ง และมิตรสหาย หากมีเรื่องก็จะคลี่คลายได้ในเร็ววัน",
            "ราหู": "ตำราพรหมชาติ 2569 ตกราหู\nทำนายว่า: ปีนี้จะเจอกับความวุ่นวาย ความเดือดเนื้อร้อนใจ และเกิดความเจ็บป่วย นอกจากนี้ยังจะได้รับความเดือดเนื้อร้อนใจจากคำพูดของคนอื่น จนต้องเสียทรัพย์สิน ปีนี้จึงจะต้องใช้ชีวิตอย่างมีสติให้มากขึ้น",
            "ปราสาท": "ตำราพรหมชาติ 2569 ตกปราสาท\nทำนายว่า: ดวงชะตาจะพบแต่ความสุข ความเจริญ กิจการงานก้าวหน้า สมหวังทุกประการ ได้รับโชคลาภ หากค้าขายอยู่ก็จะได้กำไรกลับมา หากเป็นคนโสดก็จะได้พบเนื้อคู่ในปีนี้",
            "เรือนหลวง": "ตำราพรหมชาติ 2569 ตกเรือนหลวง\nทำนายว่า: ปีนี้จะได้รับแต่ความสุขสบาย การงานเจริญก้าวหน้า ได้รับเงินทอง มีโชคลาภ และผู้ใหญ่อุปถัมภ์ตลอดปี ประสบความสำเร็จในชีวิต จนศัตรูแพ้ภัยไปเอง",
            "คอขาด": "ตำราพรหมชาติ 2569 ตกคอขาด\nทำนายว่า: ปีนี้จะได้รับความเดือดเนื้อร้อนใจ มีคนจะนำความทุกข์มาให้ จนต้องเสียทรัพย์สินเงินทองอยู่เสมอ หรือขึ้นศาล ควรหมั่นทำบุญและมีสติในการใช้ชีวิตเสมอ",
            "ฉัตรเงิน": "ตำราพรหมชาติ 2569 ตกฉัตรเงิน\nทำนายว่า: จะได้รับโชคลาภมากมาย มีผู้ใหญ่มาอุปถัมภ์ค้ำจุน หากทำงานค้าขาย หรืองานราชการอยู่จะเจริญก้าวหน้ายิ่งขึ้น ไม่มีเรื่องมาทำให้เดือดเนื้อร้อนใจ"
        };

        var mod = age % 12;
        var resultKey = "";

        if (gender === "M") {
            var malePattern = {
                0: "นาคราช", 1: "เจดีย์", 2: "ฉัตรเงิน", 3: "คอขาด",
                4: "เรือนหลวง", 5: "ปราสาท", 6: "ราหู", 7: "ฉัตรทอง",
                8: "เทวดาขี่เต่า", 9: "คนต้องขื่อคา", 10: "พ่อหมอ", 11: "แม่มด"
            };
            resultKey = malePattern[mod];
        } else {
            var femalePattern = {
                0: "ฉัตรเงิน", 1: "เจดีย์", 2: "นาคราช", 3: "แม่มด",
                4: "พ่อหมอ", 5: "คนต้องขื่อคา", 6: "เทวดาขี่เต่า", 7: "ฉัตรทอง",
                8: "ราหู", 9: "ปราสาท", 10: "เรือนหลวง", 11: "คอขาด"
            };
            resultKey = femalePattern[mod];
        }

        resultText.value = fortunes[resultKey];
    }, 2000);
}

function resetForm() {
    document.getElementById('result').value = '';
    document.getElementById('wheel-img').classList.remove('spinning');
    document.getElementById('predict-btn').disabled = false;
}
</script>
</head>

<body>
    <div class="card-container">
        <img src="https://files.eventpass.co/eventpass-api/file/1735893555225-1.jpg" alt="กงล้อพรหมชาติ" class="spin-image" id="wheel-img">
        
        <h2>โปรแกรมดูดวงพรหมชาติ 2569</h2>
        
        <form name="f" method="get" action="" onsubmit="return false;">
            <div class="form-group">
                <label for="age">อายุ (ปี): </label>
                <input type="number" id="age" min="1" max="120" style="width: 80px;" />
                &nbsp;&nbsp;
                <label for="gender">เพศ: </label>
                <select id="gender">
                    <option value="M">ชาย</option>
                    <option value="F">หญิง</option>
                </select>
            </div>
            
            <div class="form-group">
                <button type="button" id="predict-btn" class="btn btn-predict" onclick="predictFortune();">ทำนายดวงชะตา</button>
                <button type="reset" class="btn btn-reset" onclick="resetForm();">เริ่มใหม่</button>
            </div>
            
            <span class="result-label">คำทำนายที่ได้</span>
            <textarea id="result" class="result-box" readonly="readonly" placeholder="คำทำนายจะปรากฏที่นี่..."></textarea>
        </form>
    </div>
</body>
</html>
